<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="440" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <g fill="#0f172a" font-size="13">
    <rect x="30" y="70" width="190" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="125" y="98" text-anchor="middle" font-weight="700">Navegador</text>
    <text x="125" y="118" text-anchor="middle" fill="#475569" font-size="12">operadores e administradores</text>

    <rect x="30" y="250" width="190" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="125" y="278" text-anchor="middle" font-weight="700">Skill Alexa</text>
    <text x="125" y="298" text-anchor="middle" fill="#475569" font-size="12">Dark Coders</text>
  </g>

  <g>
    <rect x="320" y="40" width="320" height="340" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="480" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Raspberry Pi 3B+</text>
    <g font-size="13" fill="#0f172a" text-anchor="middle">
      <rect x="345" y="86" width="270" height="52" rx="8" fill="#ffffff" stroke="#93c5fd"/>
      <text x="480" y="108" font-weight="600">Node.js · Express 5</text>
      <text x="480" y="126" fill="#475569" font-size="12">rotas, sessões, Nunjucks, /alexa</text>

      <rect x="345" y="150" width="270" height="52" rx="8" fill="#ffffff" stroke="#93c5fd"/>
      <text x="480" y="172" font-weight="600">Socket.IO</text>
      <text x="480" y="190" fill="#475569" font-size="12">estado e comandos em tempo real</text>

      <rect x="345" y="214" width="270" height="52" rx="8" fill="#ffffff" stroke="#93c5fd"/>
      <text x="480" y="236" font-weight="600">Mosquitto (broker MQTT)</text>
      <text x="480" y="254" fill="#475569" font-size="12">rede local DarkCoders</text>

      <rect x="345" y="278" width="270" height="52" rx="8" fill="#ffffff" stroke="#93c5fd"/>
      <text x="480" y="300" font-weight="600">Arquivos JSON e logs/</text>
      <text x="480" y="318" fill="#475569" font-size="12">usuários, receitas, configurações, histórico</text>
    </g>
    <text x="480" y="362" text-anchor="middle" font-size="12" fill="#475569">IA de texto e visão: API NVIDIA (opcional)</text>
  </g>

  <g font-size="13" fill="#0f172a">
    <rect x="740" y="40" width="190" height="300" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="835" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Módulos (ESP32)</text>
    <g text-anchor="middle">
      <rect x="760" y="82" width="150" height="34" rx="6" fill="#ffffff" stroke="#86efac"/><text x="835" y="104">Esteira</text>
      <rect x="760" y="124" width="150" height="34" rx="6" fill="#ffffff" stroke="#86efac"/><text x="835" y="146">Selagem 1</text>
      <rect x="760" y="166" width="150" height="34" rx="6" fill="#ffffff" stroke="#86efac"/><text x="835" y="188">Selagem 2</text>
      <rect x="760" y="208" width="150" height="34" rx="6" fill="#ffffff" stroke="#86efac"/><text x="835" y="230">Dispenser</text>
      <rect x="760" y="250" width="150" height="34" rx="6" fill="#ffffff" stroke="#86efac"/><text x="835" y="272">Separador (servo)</text>
      <rect x="760" y="292" width="150" height="34" rx="6" fill="#ffffff" stroke="#86efac"/><text x="835" y="314">ESP32-CAM</text>
    </g>
  </g>

  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#seta)" marker-start="url(#seta)">
    <path d="M220 102 H320"/>
    <path d="M220 282 H320"/>
    <path d="M640 150 H740"/>
  </g>
  <g font-size="11.5" fill="#334155" text-anchor="middle">
    <text x="270" y="92">HTTPS / WebSocket</text>
    <text x="270" y="272">HTTPS (webhook)</text>
    <text x="690" y="140">MQTT</text>
    <text x="690" y="170" fill="#475569">HTTP (câmera)</text>
  </g>

  <g>
    <rect x="30" y="344" width="262" height="62" rx="8" fill="#fefce8" stroke="#facc15"/>
    <text x="161" y="366" text-anchor="middle" font-size="12.5" font-weight="600" fill="#713f12">Acesso externo: Tailscale Funnel</text>
    <text x="161" y="384" text-anchor="middle" font-size="11.5" fill="#713f12">site e skill usam o mesmo</text>
    <text x="161" y="398" text-anchor="middle" font-size="11.5" fill="#713f12">endereço HTTPS público</text>
  </g>
</svg>
