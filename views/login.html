<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Dark Coders - Login</title>
    <script src="/tailwind.js"></script>
    <style>
        input { font-size: 16px; }
        @media (min-width: 640px) { input { font-size: 14px; } }
    </style>
</head>
<body class="bg-gray-100 flex flex-col justify-center items-center min-h-screen font-sans px-4 py-8">

    <div class="text-center mb-8 sm:mb-10 flex flex-col items-center">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Dark Coders Logo" class="h-16 sm:h-20 w-auto mb-3 object-contain">
        <h1 class="text-xl sm:text-2xl font-bold text-gray-800 tracking-wider">Dark Coders</h1>
        <p class="text-[10px] sm:text-xs text-gray-500 tracking-widest uppercase font-semibold mt-1">SISTEMA DE CONTROLE</p>
    </div>

    <div class="relative bg-white border-2 border-blue-500 rounded-lg shadow-lg p-6 sm:p-8 w-full max-w-[340px] pt-12">
        
        <div class="absolute -top-10 left-1/2 -translate-x-1/2 bg-gray-400 text-white rounded-full p-4 border-4 border-gray-100 shadow-md">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
        </div>

        <form action="/" method="POST" class="space-y-5">
            
            {% if erro %}
            <div class="bg-red-50 border-l-4 border-red-500 p-3 rounded shadow-sm">
                <div class="flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                    <span class="text-xs font-bold text-red-700">{{ erro }}</span>
                </div>
            </div>
            {% endif %}
            
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">Usuário</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                    </span>
                    <input type="text" name="username" placeholder="Digite o usuário" required autocapitalize="none" autocorrect="off"
                        class="w-full pl-10 pr-3 py-2.5 sm:py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 text-sm bg-gray-50">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">Senha</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                    </span>
                    
                    <input type="password" name="password" id="senhaInput" placeholder="Digite a senha" required
                        class="w-full pl-10 pr-10 py-2.5 sm:py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 text-sm bg-gray-50">
                    
                    <button type="button" onclick="toggleSenha()" class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-blue-500 cursor-pointer focus:outline-none">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" 
                class="w-full bg-blue-500 text-white font-semibold py-3 sm:py-2.5 rounded-md hover:bg-blue-600 active:bg-blue-700 transition duration-200 tracking-wider shadow-md text-sm cursor-pointer">
                LOGAR
            </button>

            <div class="flex items-center justify-start text-xs text-gray-600 pt-1">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" name="remember" class="rounded border-gray-300 text-blue-500 focus:ring-blue-500 w-4 h-4">
                    Lembrar de mim
                </label>
            </div>
        </form>
    </div>

    <script>
        function toggleSenha() {
            var input = document.getElementById('senhaInput');
            input.type = input.type === 'password' ? 'text' : 'password';
        }
    </script>

</body>
</html>
